# fly.toml app configuration file generated for vta-node-backend on 2026-10-31T11:37:55-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vta-node-backend'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.node'

[env]
  PORT = '10000'

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
